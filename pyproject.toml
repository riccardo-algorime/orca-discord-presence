[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-discord-presence"
version = "1.0.0"
description = "Focus-aware Discord Rich Presence for Orca ADE on Linux"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "riccardo-algorime" }]
dependencies = ["pypresence==4.6.2"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Chat",
]

[project.scripts]
orca-discord-presence = "orca_discord_presence.__main__:main"

[project.urls]
Repository = "https://github.com/riccardo-algorime/orca-discord-presence"
Issues = "https://github.com/riccardo-algorime/orca-discord-presence/issues"

[tool.setuptools.packages.find]
where = ["src"]
